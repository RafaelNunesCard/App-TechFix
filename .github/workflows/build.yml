name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Permite que o workflow publique a Release (arquivos no repositório)
permissions:
  contents: write

# Se duas compilações começarem juntas, a mais nova espera a anterior terminar
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java (o projeto pede a versão 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar o Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar o APK de teste
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar o APK para baixar (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: techfix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # A partir daqui: só roda em push na main e no botão "Run workflow",
      # nunca em pull request.
      - name: Publicar na Release "ultima-versao"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk techfix.apk
          SHORT_SHA="${GITHUB_SHA::7}"
          DATA="$(TZ=America/Sao_Paulo date '+%d/%m/%Y às %H:%M')"
          # apaga a release antiga (e a tag) para recriar apontando para o commit novo
          gh release delete ultima-versao --cleanup-tag --yes || true
          gh release create ultima-versao techfix.apk \
            --title "TechFix - última versão" \
            --target "$GITHUB_SHA" \
            --notes "APK de teste gerado automaticamente em $DATA (commit $SHORT_SHA). Para instalar, desinstale antes a versão anterior do app."
